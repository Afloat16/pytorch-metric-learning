name: RankNContrast focused validation

on:
  push:
    branches:
      - validation/rankncontrast-score-shifts-20261115

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      TEST_DEVICE: cpu
      TEST_DTYPES: float16,float32,float64
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      BASE_SHA: b95a42310f50720a766b91008470b278364f705d
      CANDIDATE_SHA: 3ac0ad50082e9fab9753ac4f14c3b8f181c515f3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/code-polishy
          key: code-polishy-${{ runner.os }}-${{ hashFiles('.code-polishy.lock.json') }}
      - run: ./code-polishyw setup
      - name: Confirm source and test blobs
        run: git diff --exit-code "$CANDIDATE_SHA" HEAD -- src/pytorch_metric_learning/losses/rank_n_contrast_loss.py tests/losses/test_rank_n_contrast_loss.py docs/losses/rank_n_contrast_loss.md docs/design/numerics.md docs/release-notes/index.md
      - name: Review the frozen dependencies
        run: ./code-polishyw dependency-review --base "$BASE_SHA"
      - name: Install the frozen development environment
        timeout-minutes: 10
        run: uv sync --frozen --all-extras --no-build --no-install-project
      - run: ./code-polishyw supply-chain
      - name: Confirm unchanged source fails the independent value and gradient regressions
        run: |
          git show "$BASE_SHA":src/pytorch_metric_learning/losses/rank_n_contrast_loss.py > /tmp/rankncontrast-baseline.py
          cp src/pytorch_metric_learning/losses/rank_n_contrast_loss.py /tmp/rankncontrast-fixed.py
          cp /tmp/rankncontrast-baseline.py src/pytorch_metric_learning/losses/rank_n_contrast_loss.py
          set +e
          uv run --frozen --no-sync python -m pytest tests/losses/test_rank_n_contrast_loss.py::TestRankNContrastOffsets -q --junitxml=/tmp/rankncontrast-baseline.xml
          status=$?
          set -e
          cp /tmp/rankncontrast-fixed.py src/pytorch_metric_learning/losses/rank_n_contrast_loss.py
          BASELINE_STATUS="$status" uv run --frozen --no-sync python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          status = int(os.environ["BASELINE_STATUS"])
          assert status == 1, f"expected a test failure, got {status}"
          root = ET.parse("/tmp/rankncontrast-baseline.xml").getroot()
          failed = [case.attrib["name"] for case in root.iter("testcase") if case.find("failure") is not None]
          assert not list(root.iter("error")), "baseline had test errors"
          for expected in ("test_large_euclidean_distances_preserve_value", "test_large_euclidean_distances_preserve_gradients"):
              assert any(expected in name for name in failed), (expected, failed)
          print("Expected independent value and gradient regressions failed on unchanged source:", failed)
          
          PY
      - name: Run focused equations, gradients, references and composition coverage
        run: uv run --frozen --no-sync python -m pytest tests/losses/test_rank_n_contrast_loss.py tests/losses/test_distance_matrix_input.py tests/losses/test_losses_without_labels.py tests/losses/test_loss_composition.py -q
      - name: Check formatting with a readable failure diff
        run: |
          uv run --frozen --no-sync ruff format --check || {
            uv run --frozen --no-sync ruff format src/pytorch_metric_learning/losses/rank_n_contrast_loss.py tests/losses/test_rank_n_contrast_loss.py
            git diff -- src/pytorch_metric_learning/losses/rank_n_contrast_loss.py tests/losses/test_rank_n_contrast_loss.py
            exit 1
          }
      - name: Check lint and public types
        run: |
          uv run --frozen --no-sync ruff check
          uv run --frozen --no-sync ty check src tests docs/recipes benchmarks scripts
      - name: Check the governed source boundary
        run: ./code-polishyw check --files src/pytorch_metric_learning/losses/rank_n_contrast_loss.py tests/losses/test_rank_n_contrast_loss.py
      - name: Build documentation
        run: uv run --frozen --no-sync mkdocs build --strict
      - name: Report corrected values and gradients from the public API
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import json
          import math
          import torch
          from pytorch_metric_learning import losses
          
          torch.set_num_threads(1)
          rows = []
          for temperature in (0.1, 2.0):
              query = torch.tensor([[0.0, 0.0]], requires_grad=True)
              references = torch.tensor([[10000.0, 0.0]] * 4, requires_grad=True)
              value = losses.RankNContrastLoss(temperature=temperature)(
                  query, torch.tensor([0.0]), ref_emb=references,
                  ref_labels=torch.tensor([1.0, 2.0, 2.0, 3.0]),
              )
              value.backward()
              expected_value = (math.log(4) + 2 * math.log(3)) / 4
              expected_gradient = torch.tensor(
                  [[3/16, 0], [1/48, 0], [1/48, 0], [-11/48, 0]],
              ) / temperature
              value_matches = math.isclose(value.item(), expected_value, rel_tol=1e-5, abs_tol=1e-6)
              gradient_matches = torch.allclose(
                  references.grad, expected_gradient, rtol=1e-5, atol=1e-6
              )
              rows.append({
                  "temperature": temperature, "actual_value": value.item(),
                  "expected_value": expected_value, "value_matches": value_matches,
                  "actual_reference_gradients": references.grad.tolist(),
                  "expected_reference_gradients": expected_gradient.tolist(),
                  "gradient_matches": gradient_matches, "query_gradient": query.grad.tolist(),
              })
          assert all(row["value_matches"] for row in rows)
          assert all(row["gradient_matches"] for row in rows)
          print(json.dumps({"torch": torch.__version__, "threads": torch.get_num_threads(), "cases": rows}, indent=2))
          
          PY
      - name: Run the complete CPU suite
        run: uv run --frozen --no-sync --env-file tests/cpu.env python -m pytest -q
      - name: Verify final candidate blobs and whitespace
        run: |
          git diff --exit-code "$CANDIDATE_SHA" HEAD -- src/pytorch_metric_learning/losses/rank_n_contrast_loss.py tests/losses/test_rank_n_contrast_loss.py docs/losses/rank_n_contrast_loss.md docs/design/numerics.md docs/release-notes/index.md
          git diff --check "$BASE_SHA" -- src/pytorch_metric_learning/losses/rank_n_contrast_loss.py tests/losses/test_rank_n_contrast_loss.py docs/losses/rank_n_contrast_loss.md docs/design/numerics.md docs/release-notes/index.md
