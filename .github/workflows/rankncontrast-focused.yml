name: RankNContrast focused validation

on:
  push:
    branches:
      - validation/rankncontrast-score-shifts-20261115

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      TEST_DEVICE: cpu
      TEST_DTYPES: float16,float32,float64
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      BASE_SHA: b95a42310f50720a766b91008470b278364f705d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/code-polishy
          key: code-polishy-${{ runner.os }}-${{ hashFiles('.code-polishy.lock.json') }}
      - run: ./code-polishyw setup
      - name: Read the pinned task workflow and capture source context
        run: |
          ./code-polishyw docs read agent-workflows
          ./code-polishyw task-start --files src/pytorch_metric_learning/losses/rank_n_contrast_loss.py tests/losses/test_rank_n_contrast_loss.py docs/losses/rank_n_contrast_loss.md docs/design/numerics.md docs/release-notes/index.md --format json
      - name: Review the frozen dependencies
        run: ./code-polishyw dependency-review --base "$BASE_SHA"
      - name: Install the frozen development environment
        run: uv sync --frozen --all-extras --no-build --no-install-project
      - run: ./code-polishyw supply-chain
      - name: Confirm the unchanged public API disagrees with the analytic oracle
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import json
          import math
          import torch
          from pytorch_metric_learning import losses
          
          torch.set_num_threads(1)
          rows = []
          for temperature in (0.1, 2.0):
              query = torch.tensor([[0.0, 0.0]], requires_grad=True)
              references = torch.tensor([[10000.0, 0.0]] * 4, requires_grad=True)
              value = losses.RankNContrastLoss(temperature=temperature)(
                  query, torch.tensor([0.0]), ref_emb=references,
                  ref_labels=torch.tensor([1.0, 2.0, 2.0, 3.0]),
              )
              value.backward()
              expected_value = (math.log(4) + 2 * math.log(3)) / 4
              expected_gradient = torch.tensor(
                  [[3/16, 0], [1/48, 0], [1/48, 0], [-11/48, 0]],
              ) / temperature
              value_matches = math.isclose(value.item(), expected_value, rel_tol=1e-5, abs_tol=1e-6)
              gradient_matches = torch.allclose(
                  references.grad, expected_gradient, rtol=1e-5, atol=1e-6
              )
              rows.append({
                  "temperature": temperature, "actual_value": value.item(),
                  "expected_value": expected_value, "value_matches": value_matches,
                  "actual_reference_gradients": references.grad.tolist(),
                  "expected_reference_gradients": expected_gradient.tolist(),
                  "gradient_matches": gradient_matches, "query_gradient": query.grad.tolist(),
              })
          assert any(not row["value_matches"] for row in rows)
          assert any(not row["gradient_matches"] for row in rows)
          print(json.dumps({"torch": torch.__version__, "threads": torch.get_num_threads(), "cases": rows}, indent=2))
          
          PY
